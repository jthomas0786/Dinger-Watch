<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulse Sports</title><style>
:root{--bg:#0a0c12;--card:#151821;--card2:#1b1f2a;--line:#2b3040;--text:#f6f7fb;--muted:#989fab;--accent:#c9ff4d;--orange:#ff855e;--blue:#8ecbff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,sans-serif}button{font:inherit;color:inherit;cursor:pointer}header{height:64px;display:flex;align-items:center;padding:0 4.5%;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0a0c12ed;backdrop-filter:blur(12px);z-index:4}.brand{font-size:21px;font-weight:900;letter-spacing:-1px}.brand i{font-style:normal;color:var(--accent)}nav{display:flex;gap:3px;margin-left:40px}nav button{border:0;background:transparent;color:var(--muted);padding:8px 11px;font-weight:650;border-radius:6px}nav button.active,nav button:hover{color:var(--text);background:var(--card2)}.profile{margin-left:auto;width:30px;height:30px;border-radius:50%;background:linear-gradient(130deg,var(--orange),#da4eff);display:grid;place-items:center;font-weight:900;font-size:12px}main{max-width:1320px;margin:auto;padding:25px 4.5% 54px}.headline{display:flex;align-items:end;justify-content:space-between;margin-bottom:18px}.headline h1{margin:0;font-size:30px;letter-spacing:-1.2px}.headline p{color:var(--muted);margin:5px 0 0}.refresh{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:8px 11px;font-weight:700}.sports{display:flex;gap:8px;overflow:auto;padding-bottom:16px}.sports button{background:var(--card);border:1px solid var(--line);padding:9px 13px;border-radius:7px;white-space:nowrap;font-weight:750}.sports button.active{background:var(--accent);color:#152000;border-color:var(--accent)}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:19px}.section{margin-bottom:22px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.sectionhead h2{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#c7ccd3}.sectionhead span{color:var(--muted);font-size:12px}.games{display:grid;gap:9px}.game{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 15px;cursor:pointer}.game:hover,.game.selected{border-color:#73884a;background:#1b201d}.gametop{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:11px}.match{display:grid;grid-template-columns:1fr 34px 1fr;align-items:center;gap:9px}.club{display:flex;align-items:center;gap:9px;font-weight:800}.club.away{justify-content:end;text-align:right}.mark{width:29px;height:29px;border-radius:8px;display:grid;place-items:center;background:#293040;font-size:10px;font-weight:900}.club.away .mark{order:2}.score{text-align:center;font-size:18px;font-weight:900}.score small{display:block;font-size:9px;color:var(--accent);margin-top:2px}.detail{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:18px}.detailtop{display:flex;justify-content:space-between}.detail h2{margin:4px 0;font-size:21px;letter-spacing:-.7px}.meta{color:var(--muted);font-size:12px}.bigscore{display:grid;grid-template-columns:1fr 70px 1fr;text-align:center;align-items:center;margin:24px 0 17px}.bigscore b{font-size:32px}.bigscore span{font-size:11px;color:var(--muted)}.live{color:var(--accent);font-size:11px;font-weight:800}.tabs{display:flex;gap:14px;border-bottom:1px solid var(--line);margin-bottom:12px}.tabs button{padding:8px 0;background:transparent;border:0;color:var(--muted);font-weight:750;border-bottom:2px solid transparent}.tabs button.active{color:var(--text);border-color:var(--accent)}.leaders{display:grid;gap:8px}.leader{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:9px;background:#10131a;padding:9px;border-radius:7px}.avatar{width:28px;height:28px;border-radius:50%;background:#343b50;display:grid;place-items:center;font-size:10px;font-weight:800}.leader b{font-size:12px}.leader span{color:var(--muted);font-size:11px}.reaction{margin-top:13px;background:#10131a;border-radius:8px;padding:11px}.reaction strong{font-size:12px}.reactrow{display:flex;gap:7px;margin-top:9px}.reactrow button{border:1px solid var(--line);background:#1d2230;border-radius:6px;padding:6px 8px;font-size:12px}.reactrow button.voted{border-color:var(--accent);color:var(--accent)}.feed{display:grid;gap:9px}.post{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px}.author{display:flex;gap:8px;align-items:center;font-weight:800;font-size:12px}.author span{font-weight:500;color:var(--muted)}.post p{margin:10px 0;font-size:13px;line-height:1.45}.postfoot{font-size:11px;color:var(--muted);display:flex;gap:12px}.standings{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px}.standing{display:grid;grid-template-columns:26px 1fr 33px 33px;gap:7px;padding:9px 0;border-bottom:1px solid #242938;align-items:center}.standing:last-child{border:0}.standing span{font-size:12px;color:var(--muted)}.standing b{font-size:12px}.standmark{width:23px;height:23px;background:#2b3140;border-radius:6px;display:grid;place-items:center;font-size:8px;font-weight:900}@media(max-width:900px){.grid{grid-template-columns:1fr}.right{display:grid;grid-template-columns:1fr 1fr;gap:16px}.detail{grid-column:1/-1}}@media(max-width:640px){nav{margin-left:14px}nav button:not(.active){display:none}.headline{align-items:start;gap:12px;flex-direction:column}.right{display:block}.right .section{margin-top:22px}.club{font-size:12px}.bigscore{margin:18px 0}.bigscore b{font-size:26px}}
</style></head><body><header><div class="brand">PULSE<i>SPORTS</i></div><nav><button class="active">Scoreboard</button><button>Following</button><button>Discover</button></nav><div class="profile">JT</div></header><main><div class="headline"><div><h1>Game day, in real time.</h1><p id="dateTitle">Today’s scores, conversations, and standout performances.</p></div><div style="display:flex;gap:8px;align-items:center"><span id="liveStatus" class="meta">Auto-refreshing</span><button class="refresh" id="refresh">↻ Refresh scores</button></div></div><div class="sports"><button class="active" data-league="mlb">⚾ MLB</button><button data-league="nfl">🏈 NFL</button><button data-league="nba">🏀 NBA</button><button data-league="nhl">🏒 NHL</button><button data-league="eng.1">⚽ Soccer</button></div><section class="grid"><div><section class="section"><div class="sectionhead"><h2 id="boardTitle">MLB scoreboard</h2><span id="status">Loading games…</span></div><div class="games" id="games"></div></section><section class="section"><div class="sectionhead"><h2>Fan pulse</h2><span>From games you follow</span></div><div class="feed" id="feed"></div></section></div><aside class="right"><section class="section"><div id="detail" class="detail"></div></section><section class="section"><div class="sectionhead"><h2>Standings</h2><span id="standLeague">MLB</span></div><div class="standings" id="standings"></div></section></aside></section></main><script>
const $=x=>document.getElementById(x),leagueNames={mlb:'MLB',nfl:'NFL',nba:'NBA',nhl:'NHL','eng.1':'Premier League'},base=(location.hostname==='localhost'||location.hostname==='127.0.0.1')?'/api/':'https://site.api.espn.com/apis/site/v2/sports/';let league='mlb',events=[],selected=0,autoTimer;
const initials=n=>n.split(' ').map(x=>x[0]).join('').slice(0,3);function fmtDate(d){return new Intl.DateTimeFormat('en-US',{weekday:'long',month:'short',day:'numeric'}).format(d)}function score(c){return c.score==='0'&&c.records?.length===0?'—':(c.score??'—')}function gameState(g){let s=g.status.type;return s.state==='in'?s.detail:s.completed?'Final':s.detail}
async function get(path){let r=await fetch(base+path);if(!r.ok)throw Error();return r.json()}async function load(){let date=new Date(),remembered=events[selected]?.id;$('dateTitle').textContent=`${fmtDate(date)} · Live scores, conversations, and standout performances.`;$('status').textContent='Loading games…';$('liveStatus').textContent='Updating…';try{let d=await get(`${league}/scoreboard`);events=d.events||[];let next=events.findIndex(x=>x.id===remembered);if(next>=0)selected=next;renderGames();if(events.length)select(selected);else {$('detail').innerHTML='<div class="meta">No games are scheduled right now. Try another sport.</div>';}$('status').textContent=events.length?`${events.length} game${events.length===1?'':'s'} today`:'No games today';$('liveStatus').textContent=`Live · updated ${new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit',second:'2-digit'}).format(new Date())}`;await loadStandings()}catch(e){events=sampleGames();renderGames();select(0);$('status').textContent='Showing demo board — live feed unavailable';$('liveStatus').textContent='Live feed unavailable';renderStandings(sampleStandings())}}
function renderGames(){let el=$('games');el.innerHTML=events.length?events.map((g,i)=>{let c=g.competitions[0].competitors,away=c.find(x=>x.homeAway==='away'),home=c.find(x=>x.homeAway==='home');return `<article class="game ${i===selected?'selected':''}" data-i="${i}"><div class="gametop"><span>${g.competitions[0].venue?.fullName||leagueNames[league]}</span><span>${gameState(g)}</span></div><div class="match"><div class="club away"><span>${away.team.abbreviation}</span><div class="mark">${initials(away.team.abbreviation)}</div></div><div class="score">${score(away)}<small>${g.status.type.state==='in'?'LIVE':''}</small></div><div class="club"><div class="mark">${initials(home.team.abbreviation)}</div><span>${home.team.abbreviation}</span></div></div></article>`}).join(''):'<div class="game"><div class="meta">No scheduled games found.</div></div>';document.querySelectorAll('.game[data-i]').forEach(x=>x.onclick=()=>select(+x.dataset.i))}
function select(i){selected=i;renderGames();let g=events[i],c=g.competitions[0].competitors,away=c.find(x=>x.homeAway==='away'),home=c.find(x=>x.homeAway==='home'),s=g.status.type;let isLive=s.state==='in',isDone=s.completed;let lead=+away.score>+home.score?away:home;let feedText=isDone?`${lead.team.displayName} closed it out.`:isLive?`${lead.team.displayName} has the edge in a live one.`:'Who takes it?';$('detail').innerHTML=`<div class="detailtop"><div><div class="live">${isLive?'● LIVE':isDone?'FINAL':'UP NEXT'}</div><h2>${away.team.abbreviation} vs ${home.team.abbreviation}</h2><div class="meta">${g.competitions[0].venue?.fullName||'Venue TBA'} · ${g.status.type.detail}</div></div><button class="refresh" id="follow">＋ Follow</button></div><div class="bigscore"><div><b>${score(away)}</b><span>${away.team.displayName}</span></div><div class="meta">${isLive?'LIVE':isDone?'FINAL':'VS'}</div><div><b>${score(home)}</b><span>${home.team.displayName}</span></div></div><div class="tabs"><button class="active">Game</button><button>Stats</button><button>Chat</button></div><div class="leaders"><div class="leader"><div class="avatar">${initials(lead.team.abbreviation)}</div><div><b>${lead.team.displayName}</b><span> ${feedText}</span></div><b>${isLive?'Now':'Game'}</b></div></div><div class="reaction"><strong>Make a call</strong><div class="reactrow"><button class="pick" data-p="${away.team.abbreviation}">${away.team.abbreviation} wins</button><button class="pick" data-p="${home.team.abbreviation}">${home.team.abbreviation} wins</button><button class="pick" data-p="🔥">🔥 Big play</button></div></div>`;$('follow').onclick=e=>{e.target.textContent=e.target.textContent.includes('Follow')?'✓ Following':'＋ Follow'};document.querySelectorAll('.pick').forEach(x=>x.onclick=()=>{document.querySelectorAll('.pick').forEach(b=>b.classList.remove('voted'));x.classList.add('voted')});renderFeed(away,home,feedText)}
function renderFeed(a,h,text){let msgs=[['Maya R.','That matchup is going to be all offense.'],['Andre K.','I’m calling a late swing in this one.'],['Sofia L.','The pace has been unreal tonight.']];$('feed').innerHTML=msgs.map((m,i)=>`<article class="post"><div class="author"><div class="avatar">${m[0].split(' ').map(x=>x[0]).join('')}</div>${m[0]} <span>following ${i===0?a.team.abbreviation:h.team.abbreviation} · ${i+2}m</span></div><p>${i===0?text:m[1]}</p><div class="postfoot"><span>♡ ${[14,8,23][i]}</span><span>▢ ${[3,1,7][i]}</span><span>Share</span></div></article>`).join('')}
async function loadStandings(){try{let d=await get(`${league}/standings`);let groups=d.children?.flatMap(x=>x.standings?.entries||[])||d.standings?.entries||[];let rows=groups.slice(0,6).map(x=>({name:x.team.displayName,abbr:x.team.abbreviation,win:x.stats?.find(s=>s.name==='wins')?.value??'—',loss:x.stats?.find(s=>s.name==='losses')?.value??'—'}));renderStandings(rows)}catch(e){renderStandings(sampleStandings())}}function renderStandings(rows){$('standLeague').textContent=leagueNames[league];$('standings').innerHTML=rows.map((x,i)=>`<div class="standing"><span>${i+1}</span><div style="display:flex;align-items:center;gap:7px"><div class="standmark">${initials(x.abbr)}</div><b>${x.name}</b></div><span>${x.win}</span><span>${x.loss}</span></div>`).join('')}
function sampleGames(){return [['Harbor Hawks','Capital City FC','2','1','LIVE · 68th min'],['Metro Lions','Lakeview United','—','—','7:30 PM'],['Summit Bears','Coastal Waves','4','3','Final']].map((x,i)=>({status:{type:{state:i===0?'in':i===2?'post':'pre',completed:i===2,detail:x[4]}},competitions:[{venue:{fullName:'Pulse Arena'},competitors:[{homeAway:'away',team:{abbreviation:x[0].split(' ').map(y=>y[0]).join(''),displayName:x[0]},score:x[2]},{homeAway:'home',team:{abbreviation:x[1].split(' ').map(y=>y[0]).join(''),displayName:x[1]},score:x[3]}]}]}))}function sampleStandings(){return ['Harbor Hawks','Metro Lions','Summit Bears','Capital City FC','Lakeview United','Coastal Waves'].map((name,i)=>({name,abbr:initials(name),win:18-i,loss:5+i}))}
document.querySelectorAll('.sports button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.sports button').forEach(x=>x.classList.remove('active'));b.classList.add('active');league=b.dataset.league;selected=0;$('boardTitle').textContent=leagueNames[league]+' scoreboard';load()});$('refresh').onclick=load;load();autoTimer=setInterval(load,30000);document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInterval(autoTimer)}else{load();autoTimer=setInterval(load,30000)}});
</script></body></html>
